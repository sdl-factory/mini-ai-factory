# Which models exist in the factory and how they are reached. This file is control-plane
# configuration: change it through a reviewed pull request, like code.
#
# All three models are available on the gateway, but each project's virtual key decides
# which ones that project may use (see create-project-key.sh). Model names here must match
# what clients request: Claude Code sends the names set in ANTHROPIC_MODEL and
# ANTHROPIC_DEFAULT_*_MODEL.
model_list:
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # A local open-weight model, for projects whose data must not leave the premises. Same
  # gateway, same API and same keys as the hosted models: only the route differs. Ollama
  # runs on the host (natively, to use the GPU); on a Linux server it would be a container.
  # Price 0 because no provider bills it; set an internal rate here for chargeback.
  - model_name: local-qwen3-8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://host.docker.internal:11434
      keep_alive: "10m"
    model_info:
      supports_function_calling: true
      input_cost_per_token: 0
      output_cost_per_token: 0

# Input guardrail on every request (default_on), before the model sees it (pre_call).
# Secrets are blocked: a secret in a prompt is an incident to notice, not something to hide.
# Personal data is masked, so the work can continue without it. Regexes are a safety net,
# not a guarantee: confidential data is protected by routing (data classes), not by this.
# Per-key guardrails need a LiteLLM Enterprise licence, so this applies to all projects.
guardrails:
  - guardrail_name: input-secrets-and-pii
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: true
      patterns:
        # Secrets: block the request
        - pattern_type: prebuilt
          pattern_name: github_token
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: aws_access_key
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: aws_secret_key
          action: BLOCK
        - pattern_type: regex
          name: anthropic_api_key
          pattern: "sk-ant-[A-Za-z0-9_-]{20,}"
          action: BLOCK
        - pattern_type: regex
          name: gateway_virtual_key
          pattern: "sk-[A-Za-z0-9]{20,}"
          action: BLOCK
        # Personal data: mask it
        - pattern_type: prebuilt
          pattern_name: email
          action: MASK
        - pattern_type: prebuilt
          pattern_name: iban
          action: MASK
        - pattern_type: regex
          name: swiss_iban
          pattern: '\bCH\d{2}(?: ?[0-9A-Z]{4}){4} ?[0-9A-Z]\b'
          action: MASK
        - pattern_type: regex
          name: swiss_ahv_number
          pattern: '\b756\.\d{4}\.\d{4}\.\d{2}\b'
          action: MASK

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
